<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WARD Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.png"><link rel="stylesheet" href="market.css?v=14">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="ward.js?v=14"></script>
</head>
<body>
<main class="wrap" id="app"><p class="muted">Loading…</p></main>
<script>
header('');
let TAB = 'founding', USER = null;

async function boot() {
  await loadRates();
  const { data: { session } } = await sb.auth.getSession();
  USER = session && session.user;
  if (!USER) { $('#app').innerHTML = `<div class="card" style="max-width:420px"><h2 style="margin-top:0">Admin log in</h2>
    <form id="lf"><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" required>
    <button class="btn">Log in</button></form><p class="muted" style="margin-top:10px">No account yet? Create one at <a href="/market/seller.html">Seller Centre</a> with rania@wardworld.org — it becomes admin automatically.</p></div>`;
    $('#lf').onsubmit = async e => { e.preventDefault(); const f = new FormData(e.target);
      const { error } = await sb.auth.signInWithPassword({ email: f.get('email'), password: f.get('password') });
      if (error) return toast(errMsg(error)); boot(); };
    return; }
  const { data: ok } = await sb.rpc('is_admin');
  if (!ok) { $('#app').innerHTML = `<p class="empty">This account is not an admin. · <a href="#" onclick="sb.auth.signOut().then(boot);return false">log out</a></p>`; return; }
  // two-step login: if a code app is set up, ask for the 6-digit code
  try {
    const { data: lvl } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
    if (lvl && lvl.nextLevel === 'aal2' && lvl.currentLevel !== 'aal2') return mfaPrompt();
  } catch {}
  draw();
}

function draw() {
  $('#app').innerHTML = `<h1>WARD Admin</h1><p class="muted">${esc(USER.email)} · <a href="#" onclick="mfaSetup();return false">🔐 Two-step login · الدخول بخطوتين</a> · <a href="#" onclick="sb.auth.signOut().then(boot);return false">log out</a></p>
  <div class="tabs">${[['founding','Founding 100 · المؤسِّسات'],['cases','Cases · الشكاوى'],['enquiries','Enquiries · الاستفسارات'],['data','Data requests · طلبات البيانات'],['sellers','Sellers · البائعات'],['orders','Orders · الطلبات'],['payouts','Payouts · التحويلات'],['reviews','Reviews · التقييمات'],['vouchers','Vouchers · القسائم'],['sponsors','Sponsors · الرعاة'],['money','WARD revenue · إيرادات وَرد'],['settings','Settings · الإعدادات']]
    .map(([k, l]) => `<button class="${TAB===k?'on':''}" onclick="TAB='${k}';draw()">${l}</button>`).join('')}</div><div id="pane">Loading…</div>`;
  ({ founding, cases, enquiries, data: dataReq, sellers, orders, payouts, reviews, vouchers, sponsors, money, settings })[TAB]();
}

async function sellers() {
  const { data } = await sb.from('sellers').select('*,profiles(full_name,email,phone)').order('status').order('created_at', { ascending: false });
  $('#pane').innerHTML = `<div style="overflow-x:auto"><table><tr><th>Shop</th><th>Owner</th><th>Category / Emirate</th><th>Licence</th><th>Plan</th><th>Status</th><th></th></tr>
  ${(data || []).map(s => `<tr><td><b>${esc(s.shop_name)}</b><br><a href="/market/?shop=${encodeURIComponent(s.slug)}" target="_blank">view</a> ${s.instagram ? '· ' + esc(s.instagram) : ''}<br><span class="muted">${esc(s.bio || '').slice(0, 120)}</span></td>
    <td>${esc(s.profiles?.full_name)}<br>${esc(s.profiles?.email)}<br><a href="https://wa.me/${esc((s.whatsapp || '').replace(/\D/g,''))}" target="_blank">${esc(s.whatsapp)}</a></td>
    <td>${esc(catName(s.category))}<br>${esc(s.emirate)}</td><td>${esc(s.entity)}<br>${esc(s.licence_no)}</td>
    <td><select onchange="upd('${s.id}',{plan:this.value})" style="margin:0">${['starter','growth','premium'].map(p => `<option ${p===s.plan?'selected':''}>${p}</option>`).join('')}</select></td>
    <td>${tag(s.status)}<br><span class="muted">${fmtDate(s.created_at)}</span></td>
    <td>${s.status !== 'approved' ? `<button class="btn small" onclick="upd('${s.id}',{status:'approved'})">Approve</button>` : ''}
        ${s.status !== 'suspended' ? `<button class="btn small ghost" onclick="upd('${s.id}',{status:'suspended'})">Suspend</button>` : ''}</td></tr>`).join('')}
  </table></div>${(data || []).length ? '' : '<p class="muted">No sellers yet.</p>'}`;
}
async function upd(id, row) { const { error } = await sb.from('sellers').update(row).eq('id', id); if (error) return toast(errMsg(error)); toast('Updated'); sellers(); }

async function orders() {
  const { data } = await sb.from('orders').select('*,order_items(*),sellers(shop_name)').order('created_at', { ascending: false }).limit(300);
  $('#pane').innerHTML = `<p><button class="btn small ghost" onclick="csvOrders()">⬇ Download Excel (CSV)</button></p><div style="overflow-x:auto"><table><tr><th>Order</th><th>Shop</th><th>Buyer</th><th>Items</th><th>Paid by buyer</th><th>Commission</th><th>Seller gets</th><th>Status</th><th>Payment</th></tr>
  ${(data || []).map(o => `<tr><td><b>${esc(o.ref)}</b><br><span class="muted">${fmtDate(o.created_at)}</span></td><td>${esc(o.sellers?.shop_name)}</td>
    <td>${esc(o.buyer_name)}<br><a href="https://wa.me/${esc(o.buyer_phone.replace(/\D/g,''))}" target="_blank">${esc(o.buyer_phone)}</a><br><span class="muted">${esc(o.emirate || '')}</span></td>
    <td>${o.order_items.map(i => `${i.qty}× ${esc(i.title)} (${i.rate}%)`).join('<br>')}</td>
    <td>${aed(o.total_paid)}<br><span class="muted">${esc(o.payment_method)}</span></td><td>${aed(o.commission)}</td><td>${aed(o.seller_net)}</td>
    <td><select style="margin:0" onchange="st(${o.id},this.value)">${['new','accepted','shipped','delivered','cancelled','refunded'].map(s => `<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select>
      ${o.payout_date ? `<br><span class="muted">payout ${fmtDate(o.payout_date)}</span>` : ''}</td>
    <td><select style="margin:0" onchange="pay(${o.id},this.value)">${['pending','paid','refunded'].map(s => `<option ${s===o.payment_status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}
  </table></div>${(data || []).length ? '' : '<p class="muted">No orders yet.</p>'}`;
}
async function st(id, s) { const { error } = await sb.rpc('set_order_status', { p_order: id, p_status: s }); toast(error ? errMsg(error) : 'Status updated'); orders(); }
async function pay(id, s) { const { error } = await sb.from('orders').update({ payment_status: s }).eq('id', id); toast(error ? errMsg(error) : 'Payment updated'); }

async function payouts() {
  const { data } = await sb.from('orders').select('id,ref,seller_id,seller_net,payout_date,payout_status,sellers(shop_name,whatsapp)').eq('status', 'delivered').eq('payout_status', 'unpaid').order('payout_date');
  const g = {};
  (data || []).forEach(o => { const k = o.payout_date + '|' + o.seller_id; (g[k] = g[k] || { date: o.payout_date, shop: o.sellers?.shop_name, wa: o.sellers?.whatsapp, ids: [], refs: [], sum: 0 }); g[k].ids.push(o.id); g[k].refs.push(o.ref); g[k].sum += +o.seller_net; });
  const today = new Date().toISOString().slice(0, 10);
  $('#pane').innerHTML = `<div class="note">Rule: every 14 days, pay sellers for orders delivered at least 7 days earlier. Mark a batch paid after the bank transfer is done.</div>
  <div style="overflow-x:auto"><table><tr><th>Payout date</th><th>Shop</th><th>Orders</th><th>Amount</th><th></th></tr>
  ${Object.values(g).map(x => `<tr><td>${fmtDate(x.date)} ${x.date <= today ? '<span class="tag new">due</span>' : ''}</td><td>${esc(x.shop)}<br><span class="muted">${esc(x.wa)}</span></td>
    <td>${x.refs.map(esc).join(', ')}</td><td><b>${aed(x.sum)}</b></td>
    <td><button class="btn small" onclick='markPaid(${JSON.stringify(x.ids)})'>Mark paid</button></td></tr>`).join('')}</table></div>
  ${Object.keys(g).length ? '' : '<p class="muted">No payouts waiting.</p>'}`;
}
async function markPaid(ids) { const ref = prompt('Bank transfer reference (optional) · رقم التحويل'); if (ref === null) return; const { error } = await sb.from('orders').update({ payout_status: 'paid', payout_paid_at: new Date().toISOString(), payout_reference: ref || null }).in('id', ids); toast(error ? errMsg(error) : 'Marked paid'); payouts(); }

async function money() {
  const { data } = await sb.from('orders').select('status,total_paid,commission,vat,handling_fee,gateway_delivery,ward_net,seller_net');
  const o = data || [], d = o.filter(x => x.status === 'delivered'), s = (a, f) => a.reduce((t, x) => t + +x[f], 0);
  $('#pane').innerHTML = `<div class="kpis">
    <div class="kpi">Orders (all)<b>${o.length}</b></div>
    <div class="kpi">Sales delivered (GMV)<b>${aed(s(d,'total_paid'))}</b></div>
    <div class="kpi">WARD commission (delivered)<b>${aed(s(d,'commission'))}</b></div>
    <div class="kpi">WARD net (delivered)<b>${aed(s(d,'ward_net'))}</b></div>
    <div class="kpi">Owed / paid to sellers<b>${aed(s(d,'seller_net'))}</b></div>
    <div class="kpi">Open orders value<b>${aed(s(o.filter(x => ['new','accepted','shipped'].includes(x.status)),'total_paid'))}</b></div></div>`;
}

async function settings() {
  const { data: s } = await sb.from('ward_settings').select('*').single();
  $('#pane').innerHTML = `<form class="card" id="setf" style="max-width:560px">
    <div class="row"><div><label>Delivery fee per shop (AED)</label><input name="delivery_fee" type="number" step="0.01" value="${s.delivery_fee}"></div>
    <div><label>Cash-on-delivery fee (AED)</label><input name="cod_fee" type="number" step="0.01" value="${s.cod_fee}"></div></div>
    <div class="row"><div><label>Card provider fee % (pass-through)</label><input name="gateway_pct" type="number" step="0.01" value="${s.gateway_pct}"></div>
    <div><label>Bank transfer fee (AED)</label><input name="bank_fee" type="number" step="0.01" value="${s.bank_fee}"></div></div>
    <div class="row"><div><label>First payout date (a Monday)</label><input name="payout_anchor" type="date" value="${s.payout_anchor}"></div>
    <div><label>5% VAT on commission</label><select name="vat_on_commission"><option value="false" ${!s.vat_on_commission?'selected':''}>Off (not VAT-registered)</option><option value="true" ${s.vat_on_commission?'selected':''}>On</option></select></div></div>
    <button class="btn">Save settings</button></form>
    <h2>Commission rates</h2><table><tr><th>Category</th><th>Rate %</th></tr>${RATES.map(r => `<tr><td>${esc(r.name_en)} · ${esc(r.name_ar)}</td><td><input type="number" step="0.5" value="${r.rate}" style="margin:0;max-width:90px" onchange="rate('${r.key}',this.value)"></td></tr>`).join('')}</table>
    <p class="muted" style="margin-top:8px">Changes apply to new orders only.</p>`;
  $('#setf').onsubmit = async e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); f.vat_on_commission = f.vat_on_commission === 'true';
    const { error } = await sb.from('ward_settings').update(f).eq('id', 1); toast(error ? errMsg(error) : 'Saved'); };
}
async function rate(k, v) { const { error } = await sb.from('commission_rates').update({ rate: +v }).eq('key', k); toast(error ? errMsg(error) : 'Rate saved'); RATES = []; await loadRates(); }
async function reviews() {
  const { data } = await sb.from('reviews').select('*,sellers(shop_name)').order('created_at', { ascending: false }).limit(300);
  $('#pane').innerHTML = `<div class="note">Hide reviews that are abusive or break the rules. Hidden reviews stop counting in ratings.</div>
  <div style="overflow-x:auto"><table><tr><th>Shop</th><th>Rating</th><th>Review</th><th>Status</th><th></th></tr>
  ${(data || []).map(r => `<tr><td>${esc(r.sellers?.shop_name)}<br><span class="muted">${fmtDate(r.created_at)}</span></td><td>${'★'.repeat(r.rating)}</td>
    <td>${esc(r.buyer_name)}: ${esc(r.comment || '')} ${r.photos.length ? `<div class="imgs">${r.photos.map(p => `<a href="${esc(revImg(p))}" target="_blank"><div style="background-image:url('${esc(revImg(p))}')"></div></a>`).join('')}</div>` : ''}</td>
    <td>${tag(r.status)}</td><td><button class="btn small ghost" onclick="revSt(${r.id},'${r.status === 'published' ? 'hidden' : 'published'}')">${r.status === 'published' ? 'Hide' : 'Show'}</button></td></tr>`).join('')}
  </table></div>${(data || []).length ? '' : '<p class="muted">No reviews yet.</p>'}`;
}
async function revSt(id, s) { const { error } = await sb.from('reviews').update({ status: s }).eq('id', id); toast(error ? errMsg(error) : 'Updated'); reviews(); }

async function vouchers() {
  const { data } = await sb.from('vouchers').select('*,sellers(shop_name)').order('created_at', { ascending: false }).limit(500);
  $('#pane').innerHTML = `<div class="note">Each voucher belongs to one shop. Codes activate automatically when the voucher order is marked delivered or paid.</div>
  <div style="overflow-x:auto"><table><tr><th>Code</th><th>Shop</th><th>Value</th><th>Balance</th><th>Status</th><th>Expires</th><th></th></tr>
  ${(data || []).map(v => `<tr><td>${esc(v.code)}</td><td>${esc(v.sellers?.shop_name)}</td><td>${aed(v.value)}</td><td>${aed(v.balance)}</td><td>${tag(v.status)}</td><td>${fmtDate(v.expires_at)}</td>
    <td>${['pending','active'].includes(v.status) ? `<button class="btn small ghost" onclick="voidV('${esc(v.code)}')">Void</button>` : ''}</td></tr>`).join('')}
  </table></div>${(data || []).length ? '' : '<p class="muted">No vouchers yet.</p>'}`;
}
async function voidV(c) { if (!confirm('Void this voucher?')) return; const { error } = await sb.from('vouchers').update({ status: 'void' }).eq('code', c); toast(error ? errMsg(error) : 'Voided'); vouchers(); }

const FSTEPS = [['new','New · جديد'],['reviewing','Reviewing · مراجعة'],['selected','Selected · مختارة'],['verified','Verified · تم التحقق'],['agreement_sent','Agreement sent · أُرسل العقد'],['activated','Activated · مفعّلة'],['waitlist','Waitlist · انتظار'],['declined','Declined · مرفوضة']];
async function founding() {
  const { data, error } = await sb.from('founding_applications').select('*').order('created_at', { ascending: false });
  if (error) return $('#pane').innerHTML = esc(error.message);
  const a = data || [], taken = a.filter(x => ['selected','verified','agreement_sent','activated'].includes(x.status)).length;
  $('#pane').innerHTML = `<p><button class="btn small ghost" onclick="csvFounding()">⬇ Download Excel (CSV)</button></p><div class="kpis"><div class="kpi">Applications · الطلبات<b>${a.length}</b></div>
    <div class="kpi">New · جديدة<b>${a.filter(x => x.status === 'new').length}</b></div>
    <div class="kpi">Places taken · الأماكن<b>${taken} / 100</b></div>
    <div class="kpi">Activated · مفعّلة<b>${a.filter(x => x.status === 'activated').length}</b></div></div>
  <div class="note">Steps: New → Reviewing → Selected → Verified → Agreement sent → Activated (after the AED 1,200 contribution is paid). Change the step from the list. · غيّري المرحلة من القايمة.</div>
  <div style="overflow-x:auto"><table><tr><th>Applicant</th><th>Business</th><th>Contact</th><th>Details</th><th>Step</th><th>Notes</th></tr>
  ${a.map(x => `<tr><td><b>${esc(x.name)}</b><br><span class="muted">${esc(x.ref)} · ${fmtDate(x.created_at)}</span></td>
    <td>${esc(x.business)}<br><span class="muted">${esc(x.category || '')} · ${esc(x.emirate || '')}</span></td>
    <td><a href="https://wa.me/${esc((x.whatsapp || '').replace(/\D/g,''))}" target="_blank">${esc(x.whatsapp)}</a><br>${esc(x.email || '')}<br>${esc(x.social || '')}</td>
    <td>${esc(x.entity || '')}<br>${x.licence ? 'Licence: ' + esc(x.licence) : '<span class="muted">no licence no.</span>'}<br>${x.marketing ? 'OK to market' : ''}</td>
    <td><select style="margin:0" onchange="fUpd(${x.id},{status:this.value})">${FSTEPS.map(([k, l]) => `<option value="${k}" ${k === x.status ? 'selected' : ''}>${l}</option>`).join('')}</select></td>
    <td><textarea style="margin:0;min-width:160px" rows="2" onchange="fUpd(${x.id},{admin_notes:this.value})">${esc(x.admin_notes || '')}</textarea></td></tr>`).join('')}
  </table></div>${a.length ? '' : '<p class="muted">No applications yet.</p>'}`;
}
async function fUpd(id, row) { const { error } = await sb.from('founding_applications').update(row).eq('id', id); toast(error ? errMsg(error) : 'Saved · اتحفظ'); founding(); }

const CTYPES = { not_received: 'Not received · ما وصلش', damaged: 'Damaged · تالف', wrong_item: 'Wrong item · منتج غلط', late: 'Late · متأخر', refund: 'Refund · استرجاع', voucher: 'Voucher · قسيمة', seller_conduct: 'Seller conduct · سلوك البائعة', other: 'Other · أخرى' };
async function cases() {
  const { data, error } = await sb.from('cases').select('*,orders(ref),sellers(shop_name)').order('created_at', { ascending: false });
  if (error) return $('#pane').innerHTML = esc(error.message);
  const c = data || [];
  $('#pane').innerHTML = `<div class="kpis"><div class="kpi">Open · مفتوحة<b>${c.filter(x => x.status === 'open').length}</b></div>
    <div class="kpi">In progress · جاري<b>${c.filter(x => x.status === 'in_progress').length}</b></div><div class="kpi">Resolved · اتحلّت<b>${c.filter(x => ['resolved','closed'].includes(x.status)).length}</b></div></div>
  <div style="overflow-x:auto"><table><tr><th>Case</th><th>Buyer</th><th>Problem</th><th>Status</th><th>Resolution (buyer sees this)</th><th>Refund · استرجاع</th></tr>
  ${c.map(x => `<tr><td><b>${esc(x.ref)}</b><br><span class="muted">${fmtDate(x.created_at)}</span><br>Order ${esc(x.orders?.ref || '')}<br>${esc(x.sellers?.shop_name || '')}</td>
    <td>${esc(x.name || '')}<br><a href="https://wa.me/${esc((x.phone || '').replace(/\D/g,''))}" target="_blank">${esc(x.phone)}</a></td>
    <td><b>${esc(CTYPES[x.type] || x.type)}</b><br>${esc(x.message)}</td>
    <td><select style="margin:0" onchange="cUpd(${x.id},{status:this.value})">${['open','in_progress','resolved','closed'].map(k => `<option ${k === x.status ? 'selected' : ''}>${k}</option>`).join('')}</select></td>
    <td><textarea style="margin:0;min-width:180px" rows="2" onchange="cUpd(${x.id},{resolution:this.value})">${esc(x.resolution || '')}</textarea></td>
    <td>${x.refunded_at ? `<b>${aed(x.refund_amount)}</b><br><span class="muted">${esc(x.refund_method || '')} ${esc(x.refund_reference || '')}<br>paid by ${esc(x.refund_borne_by)} · ${fmtDate(x.refunded_at)}</span>` : x.order_id ?
      `<form onsubmit="refund(event,${x.id})" style="min-width:170px"><input name="amount" type="number" min="0.01" step="0.01" placeholder="AED" required style="margin:0 0 4px">
       <select name="method" style="margin:0 0 4px"><option value="cash">Cash</option><option value="bank transfer">Bank transfer</option><option value="card">Card</option></select>
       <select name="borne" style="margin:0 0 4px"><option value="seller">Seller's mistake (from her payout)</option><option value="ward">WARD goodwill (WARD pays)</option></select>
       <input name="ref" placeholder="Reference" style="margin:0 0 4px"><button class="btn small">Record refund</button></form>` : '—'}</td></tr>`).join('')}
  </table></div>${c.length ? '' : '<p class="muted">No cases.</p>'}`;
}
async function refund(e, id) {
  e.preventDefault(); const f = new FormData(e.target);
  if (!confirm(`Record a refund of AED ${f.get('amount')}? Make sure the money was actually returned to the buyer.`)) return;
  const { data, error } = await sb.rpc('admin_record_refund', { p_case: id, p_amount: +f.get('amount'), p_method: f.get('method'), p_reference: f.get('ref') || null, p_borne_by: f.get('borne') });
  if (error) return toast(errMsg(error));
  toast(data.full_refund ? 'Full refund recorded, order marked refunded' : 'Partial refund recorded' + (+data.commission_returned ? ` · AED ${data.commission_returned} commission returned to seller` : ''));
  cases();
}
function downloadCSV(name, head, rows) {
  const csv = '\ufeff' + [head, ...rows].map(r => r.map(v => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = name; a.click();
}
async function csvFounding() {
  const { data } = await sb.from('founding_applications').select('*').order('created_at');
  downloadCSV('WARD-founding-100.csv', ['ref','date','name','business','whatsapp','email','social','entity','licence','category','emirate','marketing_ok','step','notes'],
    (data || []).map(x => [x.ref, x.created_at, x.name, x.business, x.whatsapp, x.email, x.social, x.entity, x.licence, x.category, x.emirate, x.marketing ? 'yes' : 'no', x.status, x.admin_notes]));
}
async function csvOrders() {
  const { data } = await sb.from('orders').select('*,sellers(shop_name),order_items(title,qty,price)').order('created_at');
  downloadCSV('WARD-orders.csv', ['ref','date','shop','buyer','phone','emirate','items','items_total','voucher_used','delivery','handling','paid_by_buyer','commission','vat','card_fee','seller_net','ward_net','refunded','payment','payment_status','status','delivered','payout_date','payout_status','payout_ref'],
    (data || []).map(o => [o.ref, o.created_at, o.sellers?.shop_name, o.buyer_name, o.buyer_phone, o.emirate, (o.order_items || []).map(i => i.qty + 'x ' + i.title).join('; '), o.items_total, o.voucher_applied, o.delivery_fee, o.handling_fee, o.total_paid, o.commission, o.vat, (+o.gateway_items + +o.gateway_delivery).toFixed(2), o.seller_net, o.ward_net, o.refunded_amount, o.payment_method, o.payment_status, o.status, o.delivered_at, o.payout_date, o.payout_status, o.payout_reference]));
}
async function cUpd(id, row) { const { error } = await sb.from('cases').update(row).eq('id', id); toast(error ? errMsg(error) : 'Saved'); cases(); }

async function enquiries() {
  const { data } = await sb.from('enquiries').select('*,sellers(shop_name)').order('created_at', { ascending: false }).limit(300);
  $('#pane').innerHTML = `<div class="note">Buyers' questions to shops. Each shop sees and answers its own; this is the full list.</div>
  <div style="overflow-x:auto"><table><tr><th>Shop</th><th>From</th><th>Message</th><th>Status</th></tr>
  ${(data || []).map(x => `<tr><td>${esc(x.sellers?.shop_name)}<br><span class="muted">${fmtDate(x.created_at)}</span></td>
    <td>${esc(x.name)}<br><a href="https://wa.me/${esc(x.phone.replace(/\D/g,''))}" target="_blank">${esc(x.phone)}</a><br>${esc(x.email || '')}</td>
    <td>${esc(x.message)}</td><td>${tag(x.status)}</td></tr>`).join('')}</table></div>${(data || []).length ? '' : '<p class="muted">No enquiries.</p>'}`;
}

async function dataReq() {
  const { data } = await sb.from('data_requests').select('*').order('created_at', { ascending: false });
  $('#pane').innerHTML = `<div class="note">Privacy requests. Verify the person (reply from the same email or WhatsApp) before acting. Respond within 30 days. Deleting an account: remove the user in Supabase → Authentication; keep order records needed for tax/accounting.</div>
  <div style="overflow-x:auto"><table><tr><th>Request</th><th>Person</th><th>Details</th><th>Status</th><th>Notes</th></tr>
  ${(data || []).map(x => `<tr><td><b>${esc(x.ref)}</b><br>${esc(x.type)}<br><span class="muted">${fmtDate(x.created_at)}</span></td>
    <td>${esc(x.name || '')}<br>${esc(x.email || '')}<br>${esc(x.phone || '')}${x.user_id ? '<br><span class="muted">has account</span>' : ''}</td>
    <td>${esc(x.details || '')}</td>
    <td><select style="margin:0" onchange="dUpd(${x.id},{status:this.value})">${['new','verifying','done','rejected'].map(k => `<option ${k === x.status ? 'selected' : ''}>${k}</option>`).join('')}</select></td>
    <td><textarea style="margin:0" rows="2" onchange="dUpd(${x.id},{admin_notes:this.value})">${esc(x.admin_notes || '')}</textarea></td></tr>`).join('')}
  </table></div>${(data || []).length ? '' : '<p class="muted">No requests.</p>'}`;
}
async function dUpd(id, row) { const { error } = await sb.from('data_requests').update(row).eq('id', id); toast(error ? errMsg(error) : 'Saved'); dataReq(); }

async function mfaPrompt() {
  const { data } = await sb.auth.mfa.listFactors();
  const f = (data && data.totp || []).find(x => x.status === 'verified');
  if (!f) return draw();
  $('#app').innerHTML = `<div class="card" style="max-width:420px"><h2 style="margin-top:0">Enter your code · أدخلي الكود</h2>
    <p class="muted">Open your authenticator app and type the 6-digit code for WARD.</p>
    <form id="mf"><input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required aria-label="6-digit code"><button class="btn">Continue · متابعة</button></form>
    <p style="margin-top:10px"><a href="#" onclick="sb.auth.signOut().then(boot);return false">log out</a></p></div>`;
  $('#mf').onsubmit = async e => { e.preventDefault();
    const { error } = await sb.auth.mfa.challengeAndVerify({ factorId: f.id, code: new FormData(e.target).get('code').trim() });
    if (error) return toast(errMsg(error)); draw(); };
}
async function mfaSetup() {
  const { data: list } = await sb.auth.mfa.listFactors();
  const have = (list && list.totp || []).filter(x => x.status === 'verified');
  if (have.length) {
    $('#pane').innerHTML = `<div class="card" style="max-width:520px"><h2 style="margin-top:0">Two-step login is ON ✅</h2>
      <p>Each time you log in, the admin page asks for the 6-digit code from your authenticator app.</p>
      <button class="btn ghost" onclick="mfaOff('${have[0].id}')">Turn it off · إيقاف</button></div>`; return; }
  const { data, error } = await sb.auth.mfa.enroll({ factorType: 'totp', friendlyName: 'WARD admin ' + Date.now() });
  if (error) return toast(errMsg(error));
  $('#pane').innerHTML = `<div class="card" style="max-width:520px"><h2 style="margin-top:0">Turn on two-step login · الدخول بخطوتين</h2>
    <p>1. Install Google Authenticator or Microsoft Authenticator on your phone.<br>2. In the app, tap + and scan this code.<br>3. Type the 6-digit code the app shows.</p>
    <p class="ar">نزّلي Google Authenticator، دوسي + وامسحي الكود، واكتبي الـ6 أرقام.</p>
    <img src="${data.totp.qr_code}" alt="QR code for the authenticator app" style="width:200px;height:200px;background:#fff">
    <p class="muted">Can't scan? Enter this key: <code>${esc(data.totp.secret)}</code></p>
    <form id="ve"><input name="code" inputmode="numeric" maxlength="6" required aria-label="6-digit code"><button class="btn">Verify &amp; turn on · تفعيل</button></form></div>`;
  $('#ve').onsubmit = async e => { e.preventDefault();
    const { error } = await sb.auth.mfa.challengeAndVerify({ factorId: data.id, code: new FormData(e.target).get('code').trim() });
    if (error) return toast(errMsg(error)); toast('Two-step login is on ✅'); mfaSetup(); };
}
async function mfaOff(id) { if (!confirm('Turn off two-step login?')) return; const { error } = await sb.auth.mfa.unenroll({ factorId: id }); toast(error ? errMsg(error) : 'Turned off'); mfaSetup(); }

async function sponsors() {
  const [{ data: sp }, { data: pr }, { data: al }, { data: sl }] = await Promise.all([
    sb.from('sponsors').select('*').order('created_at', { ascending: false }),
    sb.from('sponsor_programmes').select('*').order('created_at', { ascending: false }),
    sb.from('sponsor_allocations').select('*,sellers(shop_name)').order('created_at', { ascending: false }),
    sb.from('sellers').select('id,shop_name').eq('status', 'approved').order('shop_name')]);
  const S = sp || [], P = pr || [], A = al || [];
  const used = id => A.filter(a => a.programme_id === id && a.status !== 'cancelled').reduce((t, a) => t + +a.amount, 0);
  $('#pane').innerHTML = `<div class="note">Sponsor-funded <b>Growth Vouchers · قسائم النمو</b>: a sponsor funds a programme, WARD allocates support to selected shops. Records only. Nothing here is shown publicly, and a programme can allocate only when it is <b>active</b> with a <b>signed sponsor agreement</b>; it can never go over budget.</div>
  <h2>Sponsors · الرعاة</h2>
  <form class="card" id="spf"><div class="row"><div><label>Sponsor name</label><input name="name" required></div><div><label>Contact person</label><input name="contact_name"></div></div>
    <div class="row"><div><label>Email</label><input name="email" type="email"></div><div><label>Phone</label><input name="phone"></div></div><button class="btn small">+ Add sponsor</button></form>
  <div style="overflow-x:auto"><table><tr><th>Sponsor</th><th>Contact</th><th>Status</th><th>Notes</th></tr>
  ${S.map(x => `<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.contact_name || '')}<br>${esc(x.email || '')} ${esc(x.phone || '')}</td>
    <td><select style="margin:0" onchange="spUpd('sponsors',${x.id},{status:this.value})">${['prospect','in_talks','agreed','active','ended'].map(k => `<option ${k === x.status ? 'selected' : ''}>${k}</option>`).join('')}</select></td>
    <td><textarea rows="2" style="margin:0" onchange="spUpd('sponsors',${x.id},{notes:this.value})">${esc(x.notes || '')}</textarea></td></tr>`).join('')}</table></div>
  <h2>Programmes · البرامج</h2>
  ${S.length ? `<form class="card" id="prf"><div class="row"><div><label>Sponsor</label><select name="sponsor_id">${S.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div><label>Programme title</label><input name="title" required></div></div>
    <div class="row"><div><label>Total budget (AED)</label><input name="budget" type="number" min="0" step="0.01" required></div><div><label>Value per shop (AED, optional)</label><input name="value_per_seller" type="number" min="1" step="0.01"></div></div>
    <label>Who qualifies (criteria)</label><textarea name="criteria" rows="2"></textarea>
    <div class="row"><div><label>Starts</label><input name="starts_on" type="date"></div><div><label>Ends</label><input name="ends_on" type="date"></div></div><button class="btn small">+ Add programme</button></form>` : '<p class="muted">Add a sponsor first.</p>'}
  ${P.map(p => { const u = used(p.id), sname = (S.find(x => x.id === p.sponsor_id) || {}).name;
    return `<div class="card"><div class="split"><b>${esc(p.title)}</b><span>${esc(sname || '')}</span></div>
    <div class="kpis"><div class="kpi">Budget<b>${aed(p.budget)}</b></div><div class="kpi">Allocated<b>${aed(u)}</b></div><div class="kpi">Remaining<b>${aed(+p.budget - u)}</b></div></div>
    <p class="muted">${esc(p.criteria || '')} ${p.starts_on ? '· ' + fmtDate(p.starts_on) + ' → ' + fmtDate(p.ends_on) : ''}</p>
    <label style="font-weight:normal"><input type="checkbox" style="width:auto" ${p.agreement_signed ? 'checked' : ''} onchange="spUpd('sponsor_programmes',${p.id},{agreement_signed:this.checked})"> Sponsor agreement signed · العقد اتمضى</label>
    <select style="max-width:200px" onchange="spUpd('sponsor_programmes',${p.id},{status:this.value})">${['draft','active','closed'].map(k => `<option ${k === p.status ? 'selected' : ''}>${k}</option>`).join('')}</select>
    <form class="row" onsubmit="alloc(event,${p.id})" style="align-items:end"><div><label>Shop</label><select name="seller_id">${(sl || []).map(x => `<option value="${x.id}">${esc(x.shop_name)}</option>`).join('')}</select></div>
      <div><label>Amount (AED)</label><input name="amount" type="number" min="1" step="0.01" value="${p.value_per_seller || ''}" required></div><button class="btn small">Allocate</button></form>
    <table><tr><th>Shop</th><th>Amount</th><th>Status</th><th>Paid / ref</th></tr>${A.filter(a => a.programme_id === p.id).map(a => `<tr><td>${esc(a.sellers?.shop_name)}</td><td>${aed(a.amount)}</td>
      <td><select style="margin:0" onchange="spUpd('sponsor_allocations',${a.id},{status:this.value})">${['allocated','paid','cancelled'].map(k => `<option ${k === a.status ? 'selected' : ''}>${k}</option>`).join('')}</select></td>
      <td>${a.paid_at ? fmtDate(a.paid_at) : ''}<input style="margin:0" placeholder="transfer ref" value="${esc(a.reference || '')}" onchange="spUpd('sponsor_allocations',${a.id},{reference:this.value})"></td></tr>`).join('')}</table></div>`; }).join('')}`;
  $('#spf').onsubmit = async e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); const { error } = await sb.from('sponsors').insert(f); toast(error ? errMsg(error) : 'Added'); sponsors(); };
  if ($('#prf')) $('#prf').onsubmit = async e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
    ['value_per_seller','starts_on','ends_on'].forEach(k => { if (!f[k]) f[k] = null; });
    const { error } = await sb.from('sponsor_programmes').insert(f); toast(error ? errMsg(error) : 'Added'); sponsors(); };
}
async function spUpd(t, id, row) { const { error } = await sb.from(t).update(row).eq('id', id); toast(error ? errMsg(error) : 'Saved'); sponsors(); }
async function alloc(e, pid) { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); f.programme_id = pid;
  const { error } = await sb.from('sponsor_allocations').insert(f); toast(error ? errMsg(error) : 'Allocated'); sponsors(); }
boot();
</script>
</body>
</html>
