<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WARD Shop · سوق وَرد</title>
<meta name="description" content="Shop products and Advance Purchase Vouchers from women-owned businesses across the UAE.">
<link rel="canonical" href="https://wardworld.org/market/"><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="market.css?v=13">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="ward.js?v=13"></script>
</head>
<body>
<main class="wrap">
  <div id="shopHead">
    <h1>WARD Shop <span class="ar">· سوق وَرد</span></h1>
    <p class="muted">Products and Advance Purchase Vouchers from women-owned businesses in the UAE. <span class="ar">منتجات وقسائم شراء مسبق من مشاريع نسائية في الإمارات.</span></p>
  </div>
  <input id="q" placeholder="Search · ابحثي عن منتج" style="max-width:420px;margin-top:14px">
  <div class="chips" id="chips"></div>
  <div id="shops"></div>
  <div class="grid" id="grid"><p class="muted">Loading…</p></div>
  <div id="shopReviews"></div>
</main>

<div class="modal" id="pm"><div class="box"><button class="x" onclick="closePM()">×</button><div id="pmBody"></div></div></div>

<script>
header('shop');
let ALL = [], SHOPS = [], CAT = '', PR = {}, SR = {}, SELLER = new URLSearchParams(location.search).get('shop');

async function init() {
  await loadRates();
  $('#chips').innerHTML = `<button class="chip on" data-c="">All · الكل</button>
    <button class="chip" data-c="voucher">🌱 Advance Purchase Vouchers · قسائم الشراء المسبق</button>` +
    RATES.map(r => `<button class="chip" data-c="${r.key}">${esc(r.name_en)} · ${esc(r.name_ar)}</button>`).join('');
  $$('#chips .chip').forEach(b => b.onclick = () => { CAT = b.dataset.c; $$('#chips .chip').forEach(x => x.classList.toggle('on', x === b)); render(); });

  let q = sb.from('products').select('id,title,description,price,voucher_value,category,stock,images,kind,seller_id,sellers!inner(shop_name,slug,emirate,status,paused_until,pause_message,lead_time_days)')
    .eq('status', 'active').eq('sellers.status', 'approved').order('created_at', { ascending: false }).limit(300);
  if (SELLER) q = q.eq('sellers.slug', SELLER);
  const [{ data, error }, pr, sr, sh] = await Promise.all([q, sb.from('product_ratings').select('*'), sb.from('seller_ratings').select('*'),
    sb.from('sellers').select('id,shop_name,slug,category,emirate,logo_url').eq('status', 'approved').order('shop_name')]);
  SHOPS = sh.data || [];
  if (error) { $('#grid').innerHTML = `<p class="empty">Could not load products: ${esc(error.message)}</p>`; return; }
  (pr.data || []).forEach(r => PR[r.product_id] = r);
  (sr.data || []).forEach(r => SR[r.seller_id] = r);
  ALL = data || [];
  if (SELLER) await shopHeader();
  render();
}

async function shopHeader() {
  const { data: s } = await sb.from('sellers').select('id,shop_name,slug,bio,emirate,instagram,logo_url,cover_url,category,paused_until,pause_message,lead_time_days').eq('slug', SELLER).maybeSingle();
  if (!s) return;
  const r = SR[s.id] || {};
  $('#shopHead').innerHTML = `<div class="cover" ${s.cover_url ? `style="background-image:url('${esc(imgUrl(s.cover_url))}')"` : ''}></div>
    <div class="shophead"><div class="logo" style="background-image:url('${esc(imgUrl(s.logo_url))}')"></div>
    <div style="padding-top:34px"><h1 style="margin:0">${esc(s.shop_name)}</h1>
    <div>${stars(r.avg_rating, r.review_count) || '<span class="muted">New shop · متجر جديد</span>'} · <span class="muted">${esc(s.emirate || '')}</span>
    ${s.instagram ? ` · <a href="https://instagram.com/${encodeURIComponent(s.instagram.replace('@',''))}" target="_blank">${esc(s.instagram)}</a>` : ''}</div></div></div>
    ${s.bio ? `<p style="margin:12px 0;white-space:pre-line">${esc(s.bio)}</p>` : ''}
    ${ALL.some(x => x.kind === 'voucher') ? `<p><button class="btn" onclick="giftFrom('${s.id}')">🌱 Grow with this shop — Advance Purchase Voucher · انمي مع المتجر — قسيمة شراء مسبق</button></p>` : ''}
    ${isPaused(s) ? `<div class="note" style="background:#fff3cd">⏸ This shop is on a break until <b>${fmtDate(s.paused_until)}</b> and isn't taking orders. · المتجر في إجازة لحد ${fmtDate(s.paused_until)}.${s.pause_message ? '<br>' + esc(s.pause_message) : ''}</div>` : ''}
    ${s.lead_time_days ? `<p class="muted">⏱ Orders are ready in about ${s.lead_time_days} day(s). · الطلب بيجهز في حوالي ${s.lead_time_days} يوم.</p>` : ''}
    <p><button class="btn ghost" onclick="askShop('${s.id}', '${esc(s.shop_name).replace(/'/g, '')}')">💬 Ask the shop · اسألي المتجر</button></p>
    <p class="muted"><a href="/market/">← All shops · كل المتاجر</a></p>`;
  const { data: rv } = await sb.from('reviews').select('*').eq('seller_id', s.id).eq('status', 'published').order('created_at', { ascending: false }).limit(30);
  $('#shopReviews').innerHTML = `<h2>Reviews · التقييمات</h2><div class="card">${reviewList(rv)}</div>`;
}

function renderShops() {
  if (SELLER || CAT === 'voucher') { $('#shops').innerHTML = ''; return; }
  const ids = new Set(ALL.filter(p => p.kind !== 'voucher' && (!CAT || p.category === CAT)).map(p => p.seller_id));
  const list = SHOPS.filter(s => ids.has(s.id) || (CAT && s.category === CAT));
  if (!list.length) { $('#shops').innerHTML = ''; return; }
  $('#shops').innerHTML = `<h2 style="margin-top:4px">Shops · المتاجر <span class="muted" style="font-size:14px">(${list.length})</span></h2>
    <div class="shoprow">${list.map(s => { const r = SR[s.id] || {}; return `<a class="shopcard" href="?shop=${encodeURIComponent(s.slug)}">
      <div class="lg" style="background-image:url('${esc(imgUrl(s.logo_url))}')"></div>
      <b>${esc(s.shop_name)}</b><span class="muted">${esc(s.emirate || '')}</span>${stars(r.avg_rating, r.review_count)}</a>`; }).join('')}</div>
    <h2>Products · المنتجات</h2>`;
}
function render() {
  renderShops();
  const t = $('#q').value.trim().toLowerCase();
  const list = ALL.filter(p => ((!CAT && (SELLER || p.kind !== 'voucher')) || (CAT && (CAT === 'voucher' ? p.kind === 'voucher' : p.category === CAT && p.kind !== 'voucher')))
    && (!t || (p.title + ' ' + (p.description || '') + ' ' + p.sellers.shop_name).toLowerCase().includes(t)));
  if (!list.length) {
    $('#grid').innerHTML = `<div class="empty" style="grid-column:1/-1">
      <p><b>${ALL.length ? 'Nothing here yet.' : 'The first shops are being onboarded now.'}</b></p>
      <p class="ar">${ALL.length ? 'لسه مفيش منتجات هنا.' : 'أول المتاجر بتنضم دلوقتي — قريباً هتلاقي منتجاتهم هنا.'}</p>
      <p style="margin-top:14px"><a class="btn" href="/market/seller.html">Open your shop · افتحي متجرك</a></p></div>`;
    return;
  }
  $('#grid').innerHTML = list.map(p => { const r = PR[p.id] || {}; return `<div class="prod" onclick="openPM(${p.id})">
    <div class="ph" style="background-image:url('${esc(imgUrl(p.images[0]))}')"></div>
    <div class="in">${p.kind === 'voucher' ? '<span class="vbadge">🌱 Advance Purchase Voucher</span>' : ''}<b>${esc(p.title)}</b>
    <span class="muted">${esc(p.sellers.shop_name)}</span><br><span class="price">${aed(p.price)}</span>
    ${p.kind !== 'voucher' && p.stock < 1 ? ' <span class="tag cancelled">sold out</span>' : ''}
    <div>${stars(r.avg_rating, r.review_count)}</div></div></div>`; }).join('');
}
$('#q').oninput = render;

async function openPM(id) {
  const p = ALL.find(x => x.id === id); if (!p) return;
  const imgs = p.images.length ? p.images : [''], r = PR[p.id] || {}, isV = p.kind === 'voucher';
  const paused = isPaused(p.sellers);
  const avail = !paused && (isV || p.stock > 0);
  $('#pmBody').innerHTML = `<div class="pd">
    <div><div class="main" id="mainImg" style="background-image:url('${esc(imgUrl(imgs[0]))}')"></div>
      <div class="thumbs">${imgs.map(i => `<div style="background-image:url('${esc(imgUrl(i))}')" onclick="$('#mainImg').style.backgroundImage='url(${esc(imgUrl(i))})'"></div>`).join('')}</div></div>
    <div>${isV ? '<span class="vbadge">🌱 Advance Purchase Voucher · قسيمة شراء مسبق</span>' : ''}
      <h2 style="margin-top:4px">${esc(p.title)}</h2>
      <p><a href="?shop=${encodeURIComponent(p.sellers.slug)}">${esc(p.sellers.shop_name)}</a> · <span class="muted">${esc(p.sellers.emirate || '')}</span></p>
      <div>${stars(r.avg_rating, r.review_count)}</div>
      <p class="price" style="font-size:22px;margin:10px 0">${aed(p.price)}</p>
      ${!isV && ALL.some(x => x.kind === 'voucher' && x.seller_id === p.seller_id) ? `<p><a href="#" onclick="giftFrom('${p.seller_id}');return false">🌱 Grow with this shop — Advance Purchase Voucher · انمي مع المتجر</a></p>` : ''}
      ${isV ? `<div class="note">${+p.voucher_value > +p.price ? `<b>Pay ${aed(p.price)} now — after one year, get products worth ${aed(p.voucher_value)} from this shop.</b><br>` : ''}
        A Advance Purchase Voucher gives <b>${esc(p.sellers.shop_name)}</b> working capital today. It is redeemed for <b>products from this shop only</b> (never cash), starting <b>one year after purchase</b> and for the 12 months after that. Your code appears once payment is confirmed. It is a prepaid shop voucher, not an investment.<br>
        <span class="ar">${+p.voucher_value > +p.price ? `ادفعي ${p.price} درهم دلوقتي — وبعد سنة خدي منتجات بقيمة ${p.voucher_value} درهم من المتجر. ` : ''}قسيمة الشراء المسبق بتدّي المتجر رأس مال دلوقتي، وبتتصرف منتجات بس من نفس المتجر (مش فلوس)، بعد سنة من الشراء وخلال الـ12 شهر اللي بعدها.</span></div>` : `<p class="muted">${esc(catName(p.category))}</p>`}
      <p style="white-space:pre-line;margin:12px 0">${esc(p.description || '')}</p>
      ${avail ? `<label>Quantity · الكمية</label><input type="number" id="qty" min="1" max="${isV ? 10 : p.stock}" value="1" style="max-width:110px">
      <br><button class="btn" onclick="addCart(${p.id})">Add to cart · أضيفي للسلة</button>` : (paused ? `<p class="note" style="background:#fff3cd">⏸ Shop on a break until ${fmtDate(p.sellers.paused_until)} · المتجر في إجازة</p>` : '<p><span class="tag cancelled">Sold out · نفدت الكمية</span></p>')}
      ${!isV && p.sellers.lead_time_days ? `<p class="muted">⏱ Ready in about ${p.sellers.lead_time_days} day(s) · بيجهز في ${p.sellers.lead_time_days} يوم</p>` : ''}
    </div></div>
    <h2>Reviews · التقييمات</h2><div id="pmRev"><p class="muted">Loading…</p></div>`;
  $('#pm').classList.add('open');
  const { data } = await sb.from('reviews').select('*').eq('product_id', id).eq('status', 'published').order('created_at', { ascending: false }).limit(20);
  $('#pmRev').innerHTML = reviewList(data);
}
function giftFrom(sid) { const v = ALL.find(x => x.kind === 'voucher' && x.seller_id === sid); if (v) openPM(v.id); }
function isPaused(s) { return s && s.paused_until && s.paused_until >= new Date().toISOString().slice(0, 10); }
function askShop(id, name) {
  $('#pmBody').innerHTML = `<h2 style="margin-top:0">Ask ${esc(name)} · اسألي المتجر</h2>
    <form id="ef"><div class="row"><div><label>Name · الاسم</label><input name="name" required maxlength="100"></div>
    <div><label>Mobile / WhatsApp · الموبايل</label><input name="phone" required maxlength="30" placeholder="+971…"></div></div>
    <label>Email (optional)</label><input name="email" type="email" maxlength="120">
    <label>Your question · سؤالك</label><textarea name="message" rows="4" required maxlength="1500" placeholder="e.g. Can you make a custom order for 20 guests? · ممكن طلب خاص؟"></textarea>
    <p class="muted">The shop replies on WhatsApp or email. Your details go to this shop only. · بياناتك بتروح للمتجر ده بس.</p>
    <button class="btn">Send · إرسال</button></form>`;
  $('#pm').classList.add('open');
  $('#ef').onsubmit = async e => { e.preventDefault(); const f = new FormData(e.target);
    const { error } = await sb.rpc('submit_enquiry', { p_seller: id, p_name: f.get('name'), p_phone: f.get('phone'), p_email: f.get('email') || null, p_message: f.get('message') });
    if (error) return toast(errMsg(error)); closePM(); toast('Sent! The shop will reply soon. · اتبعت 🌷'); };
}
function closePM() { $('#pm').classList.remove('open'); }
$('#pm').onclick = e => { if (e.target.id === 'pm') closePM(); };
function addCart(id) {
  const p = ALL.find(x => x.id === id);
  const max = p.kind === 'voucher' ? 10 : p.stock;
  const q = Math.max(1, Math.min(max, parseInt($('#qty').value) || 1));
  Cart.add(id, q); closePM(); toast('Added to cart · تمت الإضافة للسلة');
}
init();
</script>
</body>
</html>
